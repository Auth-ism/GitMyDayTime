apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitmydaytime-maintenance
  namespace: feb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitmydaytime-maintenance
  template:
    metadata:
      labels:
        app: gitmydaytime-maintenance
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: html
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "50m"
      volumes:
        - name: html
          configMap:
            name: gitmydaytime-maintenance
---
apiVersion: v1
kind: Service
metadata:
  name: gitmydaytime-maintenance-service
  namespace: feb
spec:
  selector:
    app: gitmydaytime-maintenance
  ports:
    - port: 80
      targetPort: 80
