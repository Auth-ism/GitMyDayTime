services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host'a açık: `npm run dev` sunucuyu konteyner dışında çalıştırıyor.
      - "5432:5432"
    environment:
      - POSTGRES_USER=gmd
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli — .env dosyasına ekleyin}
      - POSTGRES_DB=gitmydaytime
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmd -d gitmydaytime"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://gmd:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}@postgres:5432/gitmydaytime
      # NODE_ENV=production yukarıda set olduğu için sunucu zayıf/eksik secret ile açılmaz.
      # En az 32 karakter: openssl rand -base64 32
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET gerekli — .env dosyasına ekleyin}
      - REDIS_URL=redis://redis:6379
volumes:
  pgdata:
