services:
  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=gmd
      - POSTGRES_PASSWORD=gmd_dev
      - POSTGRES_DB=gitmydaytime
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmd -d gitmydaytime"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://gmd:gmd_dev@postgres:5432/gitmydaytime
      - JWT_SECRET=BUtEhuCsbfp+redZ1sZ/lEUEFtGf1z0BxXV/llrkkg=
      - REDIS_URL=redis://redis:6379
volumes:
  pgdata:
