apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitmydaytime-pgdata-pvc
  namespace: feb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitmydaytime-postgres
  namespace: feb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitmydaytime-postgres
  template:
    metadata:
      labels:
        app: gitmydaytime-postgres
    spec:
      initContainers:
        - name: init-pgdata
          image: busybox
          command:
            [
              "sh",
              "-c",
              "mkdir -p /var/lib/postgresql/data/pgdata && chown -R 999:999 /var/lib/postgresql/data",
            ]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: gmd
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitmydaytime-secret
                  key: db-password
            - name: POSTGRES_DB
              value: gitmydaytime
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: gitmydaytime-pgdata-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gitmydaytime-postgres-service
  namespace: feb
spec:
  selector:
    app: gitmydaytime-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitmydaytime-redis
  namespace: feb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitmydaytime-redis
  template:
    metadata:
      labels:
        app: gitmydaytime-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: gitmydaytime-redis-service
  namespace: feb
spec:
  selector:
    app: gitmydaytime-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitmydaytime
  namespace: feb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitmydaytime
  template:
    metadata:
      labels:
        app: gitmydaytime
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: gitmydaytime
          image: hub.umceko.com/byfeb/gitmydaytime:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gitmydaytime-secret
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitmydaytime-secret
                  key: jwt-secret
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gitmydaytime-secret
                  key: resend-api-key
            - name: RESEND_KEY
              valueFrom:
                secretKeyRef:
                  name: gitmydaytime-secret
                  key: resend-api-key
            - name: REDIS_URL
              value: "redis://gitmydaytime-redis-service:6379"
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: gitmydaytime-secret
                  key: admin-email
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: gitmydaytime-service
  namespace: feb
spec:
  selector:
    app: gitmydaytime
  ports:
    - port: 80
      targetPort: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitmydaytime-ingress
  namespace: feb
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gmd.byfeb.com
      secretName: gitmydaytime-tls
  rules:
    - host: gmd.byfeb.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitmydaytime-service
                port:
                  number: 80
